name: Sync to Hugging Face Hub
on:
  push:
    branches:
      - main
      - feature/simulation
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Hugging Face Hub
        run: pip install huggingface_hub

      - name: Upload simulation folder to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import HfApi
          import os
          
          api = HfApi()
          print('Starting upload...')
          api.upload_folder(
              folder_path='./simulation', # This explicitly grabs the folder
              repo_id='sarathra/tesal-roadster-ai-brain', # <--- IMPORTANT: See note below
              repo_type='space',
              token=os.environ['HF_TOKEN']
          )
          print('Upload complete!')
          "